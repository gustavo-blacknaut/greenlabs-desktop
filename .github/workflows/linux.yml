name: Pacotes Linux

# AppImage e .deb não saem do Windows: o AppImage precisa criar links
# simbólicos (que no Windows exigem Modo de Desenvolvedor) e o .deb depende do
# fpm, que só roda em Unix. Numa máquina Linux os dois saem sem truque nenhum.
#
# Dispara sozinho ao publicar uma tag v*, ou na mão pela aba Actions.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  empacotar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Empacotar AppImage, deb e tar.gz
        run: npx electron-builder --linux AppImage deb tar.gz --x64 -c.directories.output=dist-installer

      - name: Guardar os pacotes
        uses: actions/upload-artifact@v4
        with:
          name: greenlabs-linux
          path: |
            dist-installer/*.AppImage
            dist-installer/*.deb
            dist-installer/*.tar.gz

      # Numa tag, anexa direto no release correspondente.
      - name: Anexar ao release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/*.AppImage
            dist-installer/*.deb
            dist-installer/*.tar.gz
